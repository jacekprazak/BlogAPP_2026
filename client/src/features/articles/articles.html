<div class="hero bg-base-200 min-h-screen">
    <div class="hero-content text-center">
        <div class="flex flex-col items-center">
            <div class="display-block">
                <p class="text-5xl text-red-800 font-serif mx-auto text-center">Pani przypierdalasińska czyli co mnie
                    w#$%wia</p>
            </div>
            @if(!registerMode()) {
               <div class="flex items-center gap-3">
                <button class="btn btn-primary btn-lg" (click)="showRegister(true)">Register</button>
                <button class="btn btn-primary btn-lg">Read more???</button>

            </div>


            <div class="card bg-base-300 w-1/2 mx-auto p-10 mt-10 shadow-xl">
                <table class="table">
                    @for (article of articles(); track $index) {
                    <tr class="table-row">
                        <td class="text-secondary">{{article.title}}</td>
                        <td class="text-warning">{{article.content}}</td>
                        <td class="text-warning"><button class="btn btn-block btn-primary">Button</button></td>
                    </tr>
                    }
                </table>
            </div>
            }
            @else
            {
             <app-register (cancelRegister)="showRegister($event)" />
            }

        </div>
    </div>
</div>
